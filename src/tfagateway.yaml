# configuration for a Sonoff RF-Bridge

esphome:
  name: "tfagateway"
  friendly_name: "TFA-Gateway"
  comment: "Author KHit6 (khit6@gmx.net)"
  project:
    name: "KHit6.tfagateway"
    version: "3.0.0"
  includes:
    - tfa_30_32xx.h
    - bit_util.h
    - tfa_30_32xx.cpp
    - bit_util.cpp

esp8266:
  board: esp8285

substitutions:
  TIMEOUT: 180s
  RX_PIN: GPIO04
  TX_PIN: GPIO05
  LED_PIN: GPIO13

packages:
  - !include common.yaml

